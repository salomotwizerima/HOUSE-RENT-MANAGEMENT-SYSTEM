<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<style>

:root{
    --primary:#0b3d91;
    --secondary:#00b4ff;
    --light:#f5f7fa;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
    height:100vh;
}

/* BACKGROUND SLIDER */
.slider{
    position:fixed;
    width:100%;
    height:100vh;
    z-index:-2;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:1s;
}

.slide.active{
    opacity:1;
}

/* DARK OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.6);
    z-index:-1;
}

/* CONTAINER */
.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* FORM BOX */
.form-box{
    width:400px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:20px;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:popup 0.6s ease;
}

@keyframes popup{

    from{
        transform:translateY(40px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }

}

/* LOGO */
.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-circle{
    width:70px;
    height:70px;
    background:white;
    color:var(--primary);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:25px;
    font-weight:bold;
}

.logo h1{
    margin-top:15px;
}

.logo p{
    color:#ddd;
    margin-top:5px;
}

/* INPUTS */
.input-box{
    margin-top:18px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#eee;
}

/* BUTTON */
button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:30px;
    background:var(--primary);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#06265f;
    transform:scale(1.02);
}

/* EXTRA */
.extra{
    text-align:center;
    margin-top:20px;
}

.extra a{
    color:#00c6ff;
    text-decoration:none;
    font-weight:bold;
}

.extra a:hover{
    text-decoration:underline;
}

/* MESSAGE */
#message{
    margin-top:15px;
    text-align:center;
    color:#ffdddd;
}

/* MOBILE */
@media(max-width:500px){

.form-box{
    width:100%;
}

}

</style>
</head>

<body>

<!-- BACKGROUND SLIDER -->
<div class="slider">

<div class="slide active"
style="background-image:url('download (11).jpg');">
</div>

<div class="slide"
style="background-image:url('images (1).jpg');">
</div>

<div class="slide"
style="background-image:url('Description A fully furnished house for rent in Kigali-Rusororo Location.jpg');">
</div>

<div class="slide"
style="background-image:url('download (5).jpg');">
</div>

</div>

<div class="overlay"></div>

<!-- REGISTER FORM -->
<div class="container">

<div class="form-box">

<div class="logo">

<div class="logo-circle">
HR
</div>

<h1>Create Account</h1>

<p>
House Rent Management System
</p>

</div>

<div class="input-box">

<input type="text"
id="username"
placeholder="Enter Username">

</div>

<div class="input-box">

<input type="password"
id="password"
placeholder="Enter Password">

</div>

<div class="input-box">

<input type="password"
id="confirmPassword"
placeholder="Confirm Password">

</div>

<button onclick="register()">
Create Account
</button>

<div id="message"></div>

<div class="extra">

Already have account?

<a href="login.html">
Login
</a>

<br><br>

<a href="INDEX.HTML">
← Back Home
</a>

</div>

</div>

</div>

<script>

/* BACKGROUND SLIDER */

let slides =
document.querySelectorAll(".slide");

let index = 0;

function showSlide(){

slides.forEach(slide =>
slide.classList.remove("active")
);

index++;

if(index >= slides.length){
index = 0;
}

slides[index]
.classList.add("active");

}

setInterval(showSlide, 4000);

/* REGISTER FUNCTION */

function register(){

let user =
document.getElementById("username").value.trim();

let pass =
document.getElementById("password").value.trim();

let confirm =
document.getElementById("confirmPassword").value.trim();

let msg =
document.getElementById("message");

/* CLEAR MESSAGE */
msg.innerHTML = "";

/* VALIDATION */

if(user === "" ||
pass === "" ||
confirm === ""){

msg.innerHTML =
"Please fill all fields";

return;
}

if(pass.length < 4){

msg.innerHTML =
"Password must be at least 4 characters";

return;
}

if(pass !== confirm){

msg.innerHTML =
"Passwords do not match";

return;
}

/* SAVE ACCOUNT TO LOCAL STORAGE */

localStorage.setItem("username", user);
localStorage.setItem("password", pass);

/* SUCCESS */

alert("Account Created Successfully");

/* GO TO LOGIN PAGE */

window.location.href = "login.html";

}

</script>

</body>
</html>
